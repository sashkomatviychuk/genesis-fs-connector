[project]
name = "esl-controller"
version = "0.2.0"
description = "Async Hexagonal-архітектура для керування FreeSwitch через ESL Inbound (greenswitch), DI через dependency-injector"
requires-python = ">=3.11"
dependencies = [
    "genesis>=0.5",
    "dependency-injector>=4.42",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["myapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=myapp --cov-report=term-missing"

[tool.coverage.run]
source = ["src/myapp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
